[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "llm-json"
version = "0.1.0.dev0"
description = "Extract a usable object from language model output, or fail with the raw response attached."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Vinoth Raj R" }]
keywords = ["llm", "json", "parsing", "openai", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/VINOTH-RAJ-R/llm-json"
Issues = "https://github.com/VINOTH-RAJ-R/llm-json/issues"
Changelog = "https://github.com/VINOTH-RAJ-R/llm-json/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_json"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
